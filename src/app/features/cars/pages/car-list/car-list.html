<h2>Car List</h2>

@let s = state();
@if (s.status === 'loading') {
  <p role="status">Loading cars...</p>
} @else if (s.status === 'error') {
  <p role="alert">{{ s.message }}</p>
} @else {
  <div class="grid">
    @for (car of s.data; track car._id) {
      <app-car-card [car]="car" />
    } @empty {
      <p>No cars available at the moment.</p>
    }
  </div>
}
