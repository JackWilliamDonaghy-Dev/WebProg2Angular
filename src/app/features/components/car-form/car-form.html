<form [formGroup]="carForm" (ngSubmit)="onSubmit()" class="car-form">
  <h2>Add a car</h2>

  <div class="form-group">
    <label for="make">Make</label>
    <input id="make" type="text" formControlName="make" placeholder="e.g. Toyota" />
    @if (carForm.controls.make.touched && carForm.controls.make.hasError('required')) {
      <p>Make is required.</p>
    }
  </div>

  <div class="form-group">
    <label for="model">Model</label>
    <input id="model" type="text" formControlName="model" placeholder="e.g. Corolla" />
    @if (carForm.controls.model.touched && carForm.controls.model.hasError('required')) {
      <p>Model is required.</p>
    }
  </div>

  <div class="form-group">
    <label for="year">Year (optional)</label>
    <input id="year" type="number" formControlName="year" placeholder="e.g. 2022" />
  </div>

  @if (saveError(); as message) {
    <p role="alert">{{ message }}</p>
  }

  <div class="button-group">
    <button type="submit" [disabled]="saving()">
      {{ saving() ? 'Saving...' : 'Save car' }}
    </button>
    <a routerLink="/cars">Cancel</a>
  </div>
</form>
