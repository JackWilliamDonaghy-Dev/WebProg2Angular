<h2>Car Details</h2>

@let s = state();
@if (s.status === 'loading') {
  <p role="status">Loading car details...</p>
} @else if (s.status === 'error') {
  <p role="alert">{{ s.message }}</p>
} @else {
  <h3>{{ s.data.make }} {{ s.data.model }}</h3>
  @if (s.data.year != null) {
    <p>Year: {{ s.data.year }}</p>
  }
}
